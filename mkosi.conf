[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe

[Content]
InitrdProfiles=plymouth
Hostname=ubuntu
InitrdVolatilePackages=
    systemd
    udev
    systemd-cryptsetup
    cryptsetup-bin
    bash
    coreutils
    util-linux
    plymouth

[Build]
ToolsTree=default
CacheDirectory=mkosi.cache
Incremental=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute

[Output]
ImageId=ubuntu
OutputDirectory=mkosi.output/
Format=none